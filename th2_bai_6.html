<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        let x = parseFloat(prompt('nhap so can kiem tra: '));
        function kiem_tra(n){
            //Number.isInteger() là một hàm tích hợp sẵn trong JavaScript dùng để kiểm tra xem
            // một giá trị có phải là số nguyên hay không.
            if(Number.isInteger(n) && n > 0){
                alert(n + ' là số nguyên dương');
            }
            else{
                alert(n + ' không phải là s nguyên dương');
            }
        }
        kiem_tra(x);
    </script>
</body>
</html>
