<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        let sao1 = ["Polaris", "Aldebaran", "Deneb", "Vega", "Altair", "Dubhe", "Regulus"];
        let sao2 = ["Ursa Minor", "Taurus", "Cygnus", "Lyra", "Aquila", "Ursa Major", "Leo"];
        function ktra(sao) {
            for (let i = 0; i < sao1.length; i++) {
                if (sao === sao1[i]) {
                    return sao2[i];
                }
            }
            return "Không tìm thấy sao";
        }
        let ten_ngoi_sao = prompt("Nhập tên ngôi sao cần tra: ");
        let ket_qua = ktra(ten_ngoi_sao);
        alert(ket_qua);
    </script>
</body>
</html>
