<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        // Hàm tính giai thừa
        function giai_thua(n) {
            if (n < 0) {
                return "Không tồn tại giai thừa cho số âm";
            }
            else if (n === 0 || n === 1) {
                return 1;
            }
            else {
                let kq = 1;
                for (let i = 2; i <= n; i++) {
                    kq *= i;
                }
                return kq;
            }
        }
        let nhapSo = parseInt(prompt("Nhập một số nguyên để tính giai thừa:"));
        let ket_qua = giai_thua(nhapSo);
        alert("Giai thừa của " + nhapSo + " là: " + ket_qua);
    </script>
</body>
</html>
