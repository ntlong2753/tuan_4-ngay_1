<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>

        let a = prompt('nhập a');
        let b = prompt('nhập b')
        function tham_so(){
            if (a <= b){
                let ket_qua = parseInt(a) + parseInt(b);
                alert(ket_qua);
            }
            else{
                alert('số thứ nhất lớn hơn số thứ hai');
            }
        }
        tham_so()
    </script>
</body>
</html>
