    <script>
        function footToMeter(foot) {
            return 0.305 * foot;
        }
        function meterToFoot(meter) {
            return 3.279 * meter;
        }
        let feet = 10;
        let meters = footToMeter(feet);
        console.log(`${feet} feet = ${meters.toFixed(2)} mét`);
        meters = 5;
        feet = meterToFoot(meters);
        console.log(`${meters} mét = ${feet.toFixed(2)} feet`);
    </script>
