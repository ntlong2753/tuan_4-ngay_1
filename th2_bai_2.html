<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        const pi = 3.14;
        let r = prompt('nhập bán kính')
        function dien_tich(bankinh) {
            return pi * bankinh * bankinh;
        }
        function chu_vi(bankinh) {
            return 2 * pi * bankinh;
        }
        let c = chu_vi(r);
        let s = dien_tich(r);
        alert('chu vi là: ' + c);
        alert('diện tích là: ' + s);
    </script>
</body>
</html>
